[project]
name = "autograder2"
version = "0.1.0"
description = "Grade student work on an assignment from the blank assignment PDF and one PDF per student."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pint>=0.26.2",
    "pydantic>=2.14.3",
    "pypdfium2>=5.15.2",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.29.1",
]

[project.scripts]
autograder2 = "autograder2.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]  # so tests can import shared helpers as `tests.<module>`
markers = [
    "live: makes a paid OpenRouter call; skipped unless AUTOGRADER2_LIVE=1",
    "slow: minutes, not seconds; skipped unless AUTOGRADER2_SLOW=1",
]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.4",
    "sympy>=1.14.0",
]
