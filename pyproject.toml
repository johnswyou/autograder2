[project]
name = "redpen"
version = "0.1.0"
description = "Grade student work on an assignment from the blank assignment PDF and one PDF per student."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pypdfium2>=5.15.2",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
redpen = "redpen.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]  # so tests can import shared helpers as `tests.<module>`
markers = ["live: makes a paid OpenRouter call; skipped unless REDPEN_LIVE=1"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.4",
]
